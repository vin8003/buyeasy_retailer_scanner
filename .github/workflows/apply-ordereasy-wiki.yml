# Lands the Sep 2026 help wiki on vin8003/RetailerCustomerPlatform.
# cursor[bot] cannot push that repo (403). Push/PR uses secret RCP_PUSH_TOKEN
# (a PAT or fine-grained token with contents + pull-requests on RetailerCustomerPlatform).
#
# Trigger: Actions UI (workflow_dispatch) on master, repository_dispatch
# event_type apply-ordereasy-wiki, schedule every 5 minutes UTC, or a push to
# master that touches .github/trigger-wiki-apply.
# Patches are downloaded from Release wiki-sep-2026-2c2e (not from this checkout).
#
# Verify always runs against public origin/main (no secret). Land runs only if
# RCP_PUSH_TOKEN is set. Applied wiki + git bundle are uploaded as artifacts.
# If wiki/whats-new.md is already on RCP main, the job succeeds and skips.
# Empty secret: schedule and push exit 0 (no failure email). Dispatch/UI still fail.
name: Apply OrderEasy help wiki to RCP

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [master]
    paths:
      - ".github/trigger-wiki-apply"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Apply patches locally only (no push, no PR)
        type: boolean
        default: false
  repository_dispatch:
    types: [apply-ordereasy-wiki]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if wiki already on RCP main
        id: check
        run: |
          set -euo pipefail
          if curl -fsI "https://raw.githubusercontent.com/vin8003/RetailerCustomerPlatform/main/wiki/whats-new.md" >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "wiki/whats-new.md is already on RCP main; nothing to land."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "wiki/whats-new.md is still missing on RCP main."
          fi

      - name: Download patches from Release
        if: steps.check.outputs.already != 'true'
        run: |
          set -euo pipefail
          REL=https://github.com/vin8003/buyeasy_retailer_scanner/releases/download/wiki-sep-2026-2c2e
          mkdir -p patches
          cd patches
          curl -fsSL -O "$REL/0001-docs-wiki-refresh-help-centre-for-Sep-2026-product.patch"
          curl -fsSL -O "$REL/0002-docs-point-knowledge-base-index-at-wiki-what-s-new-a.patch"
          curl -fsSL -O "$REL/0003-docs-wiki-add-API-map-Unmet-Demand-and-remaining-Sep.patch"
          curl -fsSL -O "$REL/0004-docs-add-Django-API-surface-and-correct-scanner-capt.patch"
          curl -fsSL -O "$REL/0005-docs-wiki-document-display-label-layouts-and-city-st.patch"
          curl -fsSL -O "$REL/0006-docs-wiki-correct-Daily-Sales-Report-vs-Overview.patch"
          curl -fsSL -O "$REL/0007-docs-wiki-FAQ-for-Daily-Sales-Report-URL.patch"

      - name: Apply patches onto public origin/main
        if: steps.check.outputs.already != 'true'
        run: |
          set -euo pipefail
          git clone --depth=50 https://github.com/vin8003/RetailerCustomerPlatform.git rcp
          cd rcp
          git fetch origin main
          git checkout -B feature/wiki-content-update-2c2e origin/main
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git am ../patches/0001-docs-wiki-refresh-help-centre-for-Sep-2026-product.patch \
                 ../patches/0002-docs-point-knowledge-base-index-at-wiki-what-s-new-a.patch \
                 ../patches/0003-docs-wiki-add-API-map-Unmet-Demand-and-remaining-Sep.patch \
                 ../patches/0004-docs-add-Django-API-surface-and-correct-scanner-capt.patch \
                 ../patches/0005-docs-wiki-document-display-label-layouts-and-city-st.patch \
                 ../patches/0006-docs-wiki-correct-Daily-Sales-Report-vs-Overview.patch \
                 ../patches/0007-docs-wiki-FAQ-for-Daily-Sales-Report-URL.patch
          echo "Applied onto $(git rev-parse --short origin/main). HEAD=$(git rev-parse --short HEAD)"
          git log --oneline origin/main..HEAD
          test -f wiki/whats-new.md
          test -f wiki/project/apis.md
          test -f wiki/retailer-guide/print-labels.md
          test -f docs/05-API-SURFACE.md
          git bundle create ../rcp-wiki-commits.bundle origin/main..HEAD
          mkdir -p ../applied/docs
          cp -a wiki ../applied/wiki
          cp docs/05-API-SURFACE.md ../applied/docs/05-API-SURFACE.md
          git diff --stat origin/main...HEAD > ../applied/diffstat.txt

      - name: Upload applied wiki artifact
        if: steps.check.outputs.already != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rcp-wiki-applied
          path: |
            patches
            rcp-wiki-commits.bundle
            applied

      - name: Push branch and open PR
        if: steps.check.outputs.already != 'true'
        env:
          RCP_PUSH_TOKEN: ${{ secrets.RCP_PUSH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=true; patches applied (see artifact rcp-wiki-applied). Not pushing."
            exit 0
          fi
          if [ -z "$RCP_PUSH_TOKEN" ]; then
            MSG="Patches applied cleanly onto origin/main (artifact rcp-wiki-applied). Add repository secret RCP_PUSH_TOKEN (contents + pull requests on vin8003/RetailerCustomerPlatform), then re-run. See https://github.com/vin8003/buyeasy_retailer_scanner/issues/3 and KAN-275 / https://github.com/vin8003/RetailerCustomerPlatform/issues/178 (fetch-apply-from-scanner.sh)"
            if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ]; then
              echo "::notice::$MSG"
              echo "Quiet run ($EVENT_NAME): secret still empty; exiting 0 so GitHub does not email a failure."
              exit 0
            fi
            echo "::error::$MSG"
            exit 1
          fi
          cd rcp
          git remote set-url origin "https://x-access-token:${RCP_PUSH_TOKEN}@github.com/vin8003/RetailerCustomerPlatform.git"
          git push -u origin feature/wiki-content-update-2c2e
          export GH_TOKEN="$RCP_PUSH_TOKEN"
          if gh pr list --repo vin8003/RetailerCustomerPlatform --head vin8003:feature/wiki-content-update-2c2e --json number --jq '.[0].number' | grep -q .; then
            echo "PR already exists for this branch."
          else
            gh pr create --repo vin8003/RetailerCustomerPlatform \
              --base main \
              --head feature/wiki-content-update-2c2e \
              --title "docs: refresh help wiki for Sep 2026 product" \
              --body "KAN-275 / https://github.com/vin8003/RetailerCustomerPlatform/issues/178

          Applies the 18 Sep 2026 OrderEasy help wiki (\`wiki/\` + \`docs/05-API-SURFACE.md\`) onto \`main\`.

          Patches: https://github.com/vin8003/buyeasy_retailer_scanner/releases/tag/wiki-sep-2026-2c2e"
          fi
