# Builds the Sep 2026 help wiki to HTML and attaches it to Release wiki-sep-2026-2c2e.
# Canonical SOT remains RetailerCustomerPlatform/wiki on main (KAN-275 / issue 137).
# GitHub Pages enablement is 403 even from GITHUB_TOKEN (integration cannot create Pages).
name: Publish OrderEasy help wiki preview

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-ordereasy-wiki-pages]
  push:
    branches: [feature/wiki-content-update-2c2e]
    paths:
      - "ordereasy-help-wiki/wiki/**"
      - "ordereasy-help-wiki/build-static-site.py"
      - ".github/workflows/publish-wiki-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wiki-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wiki snapshot
        uses: actions/checkout@v4
        with:
          ref: feature/wiki-content-update-2c2e

      - name: Build static HTML
        run: python3 ordereasy-help-wiki/build-static-site.py

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: ordereasy-help-wiki-html
          path: ordereasy-help-wiki/_site

      - name: Attach HTML zip to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd ordereasy-help-wiki/_site && zip -r /tmp/ordereasy-help-wiki-html.zip .)
          gh release upload wiki-sep-2026-2c2e /tmp/ordereasy-help-wiki-html.zip --clobber --repo "$GITHUB_REPOSITORY"
